<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objetos Perdidos – Tec Campus Poniente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="header-titulo">Objetos Perdidos – Tec Campus Poniente</h1>
    <div class="header-acciones">
      <input type="text" id="campo-busqueda" placeholder="Buscar objeto..." autocomplete="off">
      <button id="btn-subir-reporte" class="btn-principal" type="button">Subir reporte</button>
    </div>
  </header>

  <main class="contenedor-principal">
    <div id="muro" class="muro"></div>
    <div id="mensaje-vacio" class="mensaje-vacio" style="display: none;">No hay objetos que coincidan</div>
  </main>

  <!-- Modal para subir reporte -->
  <div id="modal-reporte" class="modal-overlay" style="display: none;">
    <div class="modal-contenido" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo" class="modal-titulo">Publicar objeto encontrado</h2>
      <form id="form-reporte" novalidate>
        <div class="campo-grupo">
          <label for="campo-descripcion">Descripción</label>
          <textarea id="campo-descripcion" name="descripcion" rows="3" placeholder="Ej. Mochila negra con llavero de peluche"></textarea>
          <div id="error-descripcion" class="error-mensaje"></div>
        </div>

        <div class="campo-grupo">
          <label for="campo-ubicacion">Ubicación</label>
          <input type="text" id="campo-ubicacion" name="ubicacion" placeholder="Ej. Biblioteca, piso 2">
          <div id="error-ubicacion" class="error-mensaje"></div>
        </div>

        <div class="campo-grupo">
          <label for="campo-foto">Fotografía</label>
          <input type="file" id="campo-foto" name="foto" accept="image/jpeg,image/png,image/webp">
          <div id="error-foto" class="error-mensaje"></div>
        </div>

        <div class="campo-grupo">
          <label for="campo-contacto">Contacto (WhatsApp o correo)</label>
          <input type="text" id="campo-contacto" name="contacto" placeholder="Ej. 5512345678 o usuario@correo.com">
          <small class="aviso-privacidad">Este dato será visible públicamente</small>
          <div id="error-contacto" class="error-mensaje"></div>
        </div>

        <div class="modal-acciones">
          <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
          <button type="submit" id="btn-publicar" class="btn-principal">Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
